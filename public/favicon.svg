<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- High-contrast Logitix AI multi-stop gradient visible on both light and dark browser tabs -->
    <linearGradient id="logitixSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a146b" />
      <stop offset="35%" stop-color="#2a247e" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="logitixSparkleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a146b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background removed completely for true transparent favicon icon -->

  <!-- Primary Large 4-Point Sparkle with Center Cutout -->
  <path
    fill="url(#logitixSparkleGrad)"
    filter="url(#crispGlow)"
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 27 8
       C 27 20, 34 32, 46 32
       C 34 32, 27 44, 27 56
       C 27 44, 20 32, 8 32
       C 20 32, 27 20, 27 8 Z
       M 27 21
       C 27 27.5, 30.5 32, 35 32
       C 30.5 32, 27 36.5, 27 43
       C 27 36.5, 23.5 32, 19 32
       C 23.5 32, 27 27.5, 27 21 Z"
  />

  <!-- Top-Right Medium Companion Sparkle -->
  <path
    fill="url(#logitixSparkleAccent)"
    filter="url(#crispGlow)"
    d="M 48 5
       C 48 11.5, 52 16.5, 58 16.5
       C 52 16.5, 48 21.5, 48 28
       C 48 21.5, 44 16.5, 38 16.5
       C 44 16.5, 48 11.5, 48 5 Z"
  />

  <!-- Bottom-Right Small Companion Sparkle -->
  <path
    fill="url(#logitixSparkleAccent)"
    filter="url(#crispGlow)"
    d="M 48 37
       C 48 41.5, 51 45, 56 45
       C 51 45, 48 48.5, 48 53
       C 48 48.5, 45 45, 40 45
       C 45 45, 48 41.5, 48 37 Z"
  />
</svg>
