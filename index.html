<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>LOGITIX AI Studio</title>
    <script>
      // Gracefully prevent unhandled WebSocket/HMR disconnect rejections in the cloud preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = String((reason && (reason.message || reason.stack || reason)) || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          msg.includes('closed without opened') ||
          msg.includes('auth/network-request-failed') ||
          msg.includes('network-request-failed')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String((event && (event.message || event.filename)) || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          msg.includes('closed without opened')
        ) {
          event.preventDefault();
        }
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="LOGITIX AI Studio - Executive Assistant powered by Gemini, Claude, Manus & OpenAI" />
    <meta property="og:title" content="LOGITIX AI Studio" />
    <meta property="og:description" content="LOGITIX AI Studio - Executive Assistant powered by Gemini, Claude, Manus & OpenAI" />

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
